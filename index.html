<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>에니어그램 성격유형 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFCFB; --surface:#FFFFFF; --ink:#2A3A3D; --muted:#6B7B7E; --line:#E1E8E6;
  --teal:#2E9C93; --teal-soft:#E3F4F1; --gold:#F0A83A; --gold-soft:#FFF3DC; --warn:#B4442F; --warn-soft:#F6DED8;
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 64px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.3;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.top .wrap{padding-bottom:12px;padding-top:12px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.brand b{font-family:var(--serif);font-size:17px}
.brand span{font-size:13px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.step{border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.step i{display:block;width:100%;height:6px;border-radius:3px;background:var(--line)}
.step.done i{background:var(--teal)}
.step.part i{background:linear-gradient(90deg,var(--teal) var(--p),var(--line) var(--p))}
.step.cur{color:var(--ink);font-weight:600}
.step.cur i{outline:2px solid var(--teal);outline-offset:1px}
.step:disabled{cursor:not-allowed;opacity:.5}

/* intro */
.intro{padding-top:40px}
.mark{width:132px;height:132px;margin-bottom:20px}
.intro h1{font-size:34px;margin-bottom:14px}
.lead{font-size:18px;color:var(--muted);margin:0 0 32px}
.qa{border-top:1px solid var(--line);padding:22px 0}
.qa h2{font-size:20px;margin-bottom:8px}
.qa p{margin:6px 0}
.qa ul{margin:8px 0;padding-left:20px}
.qa li{margin:4px 0}

/* type page */
.typehead{padding:32px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.typehead h1{font-size:30px}
.count{font-size:14px;color:var(--muted)}
.hint{color:var(--muted);font-size:15px;margin:0 0 16px}
.qlist{list-style:none;margin:0;padding:0;counter-reset:q}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;margin-bottom:10px;display:grid;grid-template-columns:28px 1fr;column-gap:10px}
.q.missing{border-color:var(--warn);background:var(--warn-soft)}
.q .n{font-family:var(--serif);font-weight:700;color:var(--muted);font-size:15px;padding-top:1px}
.q .t{margin:0 0 12px}
.q fieldset{grid-column:2;border:0;margin:0;padding:0;display:flex;gap:8px}
.q legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.opt{position:relative;flex:0 0 auto}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-block;min-width:84px;text-align:center;padding:7px 16px;border:1.5px solid var(--line);border-radius:999px;font-weight:500;font-size:15px;background:var(--surface)}
.opt input:checked + span{border-color:var(--teal);background:var(--teal);color:var(--surface)}
.opt.no input:checked + span{border-color:#9AA8AB;background:#9AA8AB;color:#fff}
.opt input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;align-items:center}
.btn{border:1.5px solid var(--teal);color:var(--teal);background:transparent;padding:11px 22px;border-radius:8px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.quiet{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:15px;display:none}
.msg.show{display:block}

/* result */
.result{padding-top:32px}
.result h1{font-size:28px;margin-bottom:6px}
.verdict{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;margin:20px 0 8px}
.wheel{width:100%;max-width:330px;justify-self:center}
.wheel text{font-family:var(--sans)}
.big{font-family:var(--serif);font-size:60px;line-height:1;margin:4px 0 6px}
.big small{font-size:22px;color:var(--muted);margin-left:6px}
.label{font-size:14px;color:var(--muted);margin:0}
.wing{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.wing strong{font-family:var(--serif);font-size:24px}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.tie{background:var(--gold-soft);border-radius:10px;padding:18px;margin:18px 0}
.tie h2{font-size:19px;margin-bottom:6px}
.tie .pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tie details{margin-top:12px;background:var(--surface);border-radius:8px;padding:10px 14px}
.tie summary{cursor:pointer;font-weight:600}
.tie ol{margin:8px 0;padding-left:22px;font-size:14px}
.tie li.y{color:var(--ink)} .tie li.nn{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px;margin:12px 0 10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px}
.meta label{display:flex;align-items:center;gap:10px;font-weight:600}
.meta input{font:inherit;font-weight:400;border:1.5px solid var(--line);border-radius:6px;padding:6px 10px;width:190px;max-width:55vw;background:var(--surface);color:var(--ink)}
.meta span{color:var(--muted)}
.scores{margin-top:32px}
.scores h2{font-size:20px;margin-bottom:12px}
.row{display:grid;grid-template-columns:150px 1fr 64px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--muted)}
.row.main .bar b{background:var(--teal)} .row.wingrow .bar b{background:var(--gold)}
.row.main{font-weight:600}
.row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}

@media (max-width:600px){
  .intro h1{font-size:28px}
  .verdict{grid-template-columns:1fr;gap:8px}
  .row{grid-template-columns:110px 1fr 54px;font-size:14px}
  .step{font-size:11px}
  .opt span{min-width:72px}
}
@media (prefers-reduced-motion:no-preference){
  .wheel .pt{transition:transform .5s ease}
  .reveal{animation:rise .6s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media print{
  .top,.nav,.actions,.tie .pick,.tie details,#pdfMsg{display:none!important}
  .meta input{border:0;padding:0}
  body{background:#fff}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><b>에니어그램 성격유형 검사</b><span id="prog"></span></div>
  <nav class="steps" id="steps" aria-label="검사 단계"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const DATA = {"2": ["가장 좋을 때의 나는 조건 없이 다른 사람을 사랑한다. 내가 베푼 것을 상대가 어떻게 갚을지는 생각하지 않는다.", "사람들은 내가 이타적이고, 다른 사람이 잘 지내도록 진심으로 챙긴다고 말하곤 한다.", "어떤 사람들은 나를 성인(聖人)처럼 여길지도 모른다. 하지만 나는 내 부족함을 알기에 스스로를 그렇게 생각하지 않는다.", "나는 나를 내세우거나 내가 해 준 일을 알리지 않고도, 다른 사람을 위해 기꺼이 희생할 수 있다.", "다른 사람에게 좋은 일이 생기면 나도 행복하다. 나는 할 수 있는 모든 방법으로 다른 사람을 도우려고 최선을 다한다.", "나는 다른 사람을 잘 보살핀다. 사람들에게 느끼는 내 감정 때문에 그들을 더 깊이 배려하게 된다.", "나는 사랑이 삶에서 가장 소중한 가치라고 생각한다. \"사랑이 없다면 삶이 무슨 의미가 있을까?\"", "좋은 친구가 된다는 것에는, 내가 상대를 얼마나 아끼는지 알게 해 주는 것도 포함된다고 생각한다.", "나는 사람들과 가까워지는 것이 좋다. 특히 친구를 껴안는 등 스킨십으로 마음을 표현하는 것이 전혀 어색하지 않다.", "나는 친구와 우정에 대해 자주 생각한다. 아주 친한 친구를 다섯 명에서 열 명까지 꼽을 수 있다.", "나는 가족과 친구들이 곁에 있는 것이 즐겁다. 그들도 내 안내와 조언을 잘 받아들이고 좋아한다.", "나에게 소중한 사람을 떠나보내기는 힘들지만, 그 사람을 소유하려고 하지는 않는다.", "모든 사람이 그렇지는 않겠지만, 많은 사람들이 내가 줄 수 있는 도움을 정말로 필요로 한다고 생각한다.", "다른 사람 걱정은 조금 줄이고, 나 자신을 더 챙기고 생각해야 할지도 모르겠다.", "솔직히 나는 매우 너그럽고 사려 깊은 사람이다. 살면서 나를 만난 사람들은 운이 좋은 것이다.", "내가 누군가를 위해 해 준 일을 그 사람에게 말하게 된다면, 그것은 내가 그를 얼마나 아끼는지 알려 주고 싶어서다.", "나는 다른 사람을 이용한다고 생각하지 않는다. 설령 그렇게 하더라도, 그것이 그 사람에게 가장 좋은 일이기 때문이다.", "머지않아 가족과 친구들도 내가 그들을 보살핀 만큼 나를 보살펴 줘야 할 것이다.", "나는 사람들을 너무 사랑해서 많이 괴롭다. 특히 사람들이 나를 당연하게 여기고, 내가 필요한 것에는 관심을 주지 않을 때 그렇다.", "살면서 유난히 자주 아팠던 것 같은데, 의사들도 내가 왜 그렇게 자주 아픈지 모른다."], "3": ["나는 나를 있는 그대로 받아들이고, 내 한계와 재능을 솔직하게 인정한다.", "나는 내가 가치 있고 소중하다고 느끼기 때문에, 한 사람으로서 나를 인정하는 것이 어렵지 않다.", "나는 자신감 있고 균형 잡힌 사람이다. 자존감을 가지고 다른 사람들을 대한다.", "나는 내가 좋다. 나는 가치 있고 매력 있는 사람이며, 나로 사는 것이 정말 기쁘다.", "나는 야망이 있다. 다른 사람들도 자신을 발전시키는 데 시간과 노력을 들여야 한다고 생각한다.", "나는 늘 어떤 식으로든 남들과 구별되는 사람이다. 사람들은 나를 눈에 띄는 사람, 진짜 \"승자\"로 본다.", "사람들이 겉으로 말하지는 않지만, 여러 이유로 나를 부러워하거나 질투한다는 것을 나는 안다.", "나는 내가 경쟁심이 강하다는 것을 안다. 경쟁심이 없는 사람은 아마 현실을 제대로 보지 못하는 패자일 것이다.", "나는 효율적이고, 일을 끝내는 방법을 잘 안다. 그래서 다른 사람의 계획이나 생각이 내 일을 방해하는 것은 참을 수 없다.", "실제 내 모습이 아니라 되고 싶은 모습으로 나를 보여 주더라도, 좋은 인상을 주고 싶은 것은 잘못이 아니다.", "성공하려면 사람들에게 적절한 이미지를 보여 주는 방법을 아는 것이 중요하다.", "사람들은 자기 현실을 스스로 만든다. 스스로 망설이거나 일을 망쳤다면, 그것은 그들의 선택이고 결과도 그들이 감당해야 한다.", "일이 잘 풀리지 않으면 방법을 바꾸면 된다. 원하는 것을 얻기 위해 필요한 일을 하면 된다.", "다른 사람들이 나를 어떻게 생각하는지가 나에게는 중요하다. 누군가에게 나쁜 평가를 받으면 화가 난다.", "세상 어디에나 '승자'와 '패자'가 있다. 나는 분명히 승자다.", "나는 대부분의 사람보다 낫다. 더 똑똑하고, 더 잘생겼고, 더 성공했다. 나는 내 몫을 충분히 해내고 있고, 여러 면에서 모든 것을 갖췄다.", "나는 앞서 나가기 위해 가끔 편법을 쓰기도 한다. 하지만 다들 그렇게 하는데 무슨 차이가 있겠는가?", "많은 사람들이 나를 알지만, 나는 사람들과 너무 가까워지는 것은 싫다. 기회만 있으면 사람들이 나를 이용하려 하기 때문이다.", "관계가 틀어졌을 때 상대방이 그것을 몹시 힘들어한 적이 몇 번 있다. 하지만 그들도 스스로를 책임질 줄 알아야 한다.", "누군가 나에게 굴욕감을 주면, 되갚기 위해 꽤 비열한 행동도 할 수 있다. 그리고 실제로 대개 그렇게 한다."], "4": ["내 장점 중 하나는 감정이 풍부하다는 것이다. 상처를 받더라도 나는 그 경험을 최대한 의미 있게 활용한다.", "나는 최선을 다할 때, 아무것도 없는 데서 무언가를 만들어 낼 수 있다. 일종의 영감 같은 것이다.", "내 직관을 따랐을 때 틀린 적이 한 번도 없다.", "나는 나 자신에게 진실해야 한다고 굳게 믿는다. 그래서 가능한 한 진정성 있게 행동하려고 노력한다.", "내 창의력은 마음 깊은 곳의 감정을 표현하는 데서 나온다. 개인적인 방식이든 예술적인 방식이든 마찬가지다.", "나는 지금 내가 어떤 감정을 느끼는지 잘 안다. 그리고 그 감정이 나에게 말해 주는 것을 솔직하게 받아들이려 한다.", "좋든 싫든 나는 상상력이 매우 풍부하다. 나에게는 정말 현실처럼 느껴지는 상상의 세계를 만들 수 있다.", "나는 사람들과 오랫동안 이야기를 나누고, 그 대화를 상상 속에서 다시 떠올리며 곱씹곤 한다.", "나는 시적인 감수성이 예민하다. 하지만 아쉽게도 그 안에는 우울하고 상처받기 쉬운 감정도 함께 들어 있다.", "나는 이미 사람들에게 한 말이나 행동, 그 동기까지도 계속 다시 의심한다. 때로는 지난 일을 곱씹느라 다른 일을 거의 못 할 정도로 몰두한다.", "사람들은 내가 자기주장이 강하거나 야망이 있다고 느끼지 않을지도 모른다. 고집스럽거나 경쟁적인 모습은 원래 내 모습과 거리가 멀기 때문이다.", "누군가 내 마음을 어지럽히는 말을 하면, 그 일이 풀릴 때까지 마음을 졸이느라 다른 일은 아무것도 할 수 없다.", "나는 가끔 주변 사람들, 심지어 친한 친구에게서도 불편함을 느낀다. 정확한 이유는 모르겠지만, 어쩌면 나는 혼자인 사람인지도 모른다.", "나는 상처받았다고 느끼면, 더 이상 상처받지 않으려고 내 안으로 숨어 버리는 경향이 있다.", "화가 나는 것은 나에게 무척 고통스럽다. 누군가에게 정말 화가 나면, 무엇 때문에 괴로운지 이야기하기는커녕 그 사람과 같은 방에 있는 것조차 견디기 힘들다.", "다른 사람들은 모두 나보다 행복해 보인다. 나는 감정적으로 상처를 잘 받고, 감정을 조절하기가 힘들다.", "나는 좀처럼 마음을 추스르지 못한다. 어디서부터 시작해야 할지 모르겠고, 무언가를 시작해도 곧 모든 것이 무너져 버릴 것 같다.", "다행히 아무도 내가 나를 비난하는 것처럼 나에게 말하지는 않는다. 내 마음속 목소리는 나에게 가장 심하고 경멸적인 말을 한다.", "나는 자살에 대해 생각해 본 적이 있다. 언젠가는 그것이 내가 택할 수밖에 없는 길일지도 모른다고 느낀다.", "인생은 고통과 상실, 슬픔으로 가득하다. 적어도 지금까지 내 삶은 그랬다."], "5": ["나는 세상을 깊이 들여다보는 통찰력이 있다. 다른 사람들이 놓치거나 지나치는 것도 늘 알아차린다.", "통찰력은 내 강점 중 하나다. 어떤 일이 일어나기 전에 그 일이 어떻게 흘러갈지 미리 알 수 있을 것 같다.", "나는 내 일이나 관심 있는 일이라면 무엇이든 아주 깊이 집중할 수 있다.", "나는 남들보다 독창적인 생각과 새로운 아이디어가 많다.", "사람들은 기술적이거나 학문적인 질문의 답을 얻으려고 나를 찾아온다. 내가 무엇을 말하는지 정확히 알고 있다는 것을 그들이 인정하기 때문이다.", "생각하고 탐구하는 정신적인 삶이야말로 가장 멋진 삶이다.", "나는 지식을 탐구하는 것을 좋아한다. 책과 함께 혼자 있을 때 정말 행복하다.", "나는 연구와 학문 탐구에 흥미를 느낀다. 언젠가 어떤 분야에서 세계적인 전문가가 되고 싶다.", "나는 꽤 열정적인 사람이다. 관심 있는 일에 완전히 몰두해 푹 빠져 버리곤 한다.", "나를 좀 이상하다고 생각하는 사람들에게 놀림을 받은 적이 있다. 그들은 나를 \"괴짜\"나 \"얼간이\"라고 부른다. 그 말에도 일리는 있다고 생각한다.", "내 아이디어가 너무 복잡해서 말로 표현하기도, 다른 사람에게 이해시키기도 어려웠던 적이 있다.", "나는 무엇이든 깊이 알고 싶은 호기심과 열정으로 상대를 압도할 때가 많다. 그래서 내 인간관계는 자주 불안정하다.", "천재성은 흔히 오해를 받는다. 내 이론은 때때로 너무 앞서가기 때문에, 나는 그것을 누구와도 토론하려 하지 않는다.", "한두 번쯤 나는 많은 것을 설명해 줄 수 있는 놀랍고 새로운 관점, 깊은 생각의 열쇠를 발견한 적이 있다.", "나는 나보다 큰 권력을 가진 사람을 본래 믿지 않는다. 그래서 정치 문제는 나를 무척 불편하게 한다.", "대부분의 사람들이 너무 둔해서 무슨 일이 벌어지는지 모르는 것이 분명하다. 사실 대부분은 무언가를 알아차리기에는 너무 어리석다.", "대부분의 종교는 사람들이 버리지 못하는 유치하고 미신적인 욕구를 이용한다.", "혼자 사는 것이 안전하고 편하다. 나는 사람들이 나와 가까워지거나, 내가 무엇을 하고 무슨 생각을 하는지 아는 것이 싫다.", "때때로 내 생각들이 살아 움직이는 것 같다. 생각이 너무 빨리 떠올라서 마음을 가라앉히거나 쉬거나 잠들기가 어렵다.", "나만의 은밀한 생각들은 대부분 매우 이상하고 엉뚱하다. 하지만 그 생각들이 내 세계를 잘 보여 준다."], "6": ["가장 좋을 때의 나는 다른 사람들과 동등하며, 다른 사람만큼 나도 해낼 수 있다고 생각한다.", "사람들은 나를 매력 있고 정이 가는 사람이라고 느끼며, 내가 얼마나 사랑스러운지 말해 준다.", "다른 사람들은 대개 어떤 식으로든 나를 지켜 주려 하고, 나는 사람들에게 사랑받는 느낌이 좋다.", "나에게는 일이나 인간관계에서 안정감을 느끼는 것이 중요하다.", "나는 내 곁에 있는 사람들에게 깊이 헌신한다. 가족과 친구들은 나를 믿고 의지할 수 있다는 것을 안다.", "나는 믿음직하고 성실한 사람이다. 나와 가족이 안정적으로 살 수 있도록 열심히 일한다.", "권위 있는 사람이나 존경하는 사람이 부탁하면, 나는 망설이지 않고 그 일을 한다.", "중요한 결정을 내려야 할 때, 나는 보통 다른 사람에게 조언을 구한다. 그럴 수 없으면 일반적으로 통하는 답을 찾아본다.", "나는 스스로 결정해야 하는 상황이 되면 우유부단해지고 불안해지는 편이다.", "나는 다른 사람들이 나를 어떻게 생각하는지 늘 확신이 없다. 나를 좋아하는 것 같다가도, 때로는 싫어하는 것 같다.", "내 유머는 사람들을 헷갈리게 한다. 내 말이 속뜻과 반대로 들릴 때가 많아서, 사람들은 내가 진지한지 아닌지조차 잘 모른다.", "나는 사람들에게 엇갈린 신호를 줄 때가 있다. '아니오'라고 하고 싶을 때 '예'라고 하고, 원하지 않으면서도 남이 원하는 대로 따른다.", "나는 보통 시키는 대로 하지만, 가끔은 반대로 행동할 때도 있다.", "나는 다른 사람의 우편물을 슬쩍 없애거나 익명으로 전화를 걸었다 끊는 식의 장난으로 사람들에게 앙갚음할 수 있다는 것을 안다.", "누군가 법이나 규칙을 어기면 몹시 화가 난다.", "솔직히 나는 사람들이 선을 넘거나 규칙을 지키지 않을 때, 그들을 훈계하는 것을 어느 정도 좋아한다.", "나는 평소에는 고집이 세지 않지만, 꼭 필요할 때는 정말 고집스럽고 완고해진다.", "원하는 만큼 의욕적이고 독립적이지 못한 내가 정말 싫다. 특히 나를 믿고 의지하던 사람을 실망시켰을 때는 더 그렇다.", "나는 다른 사람을 의심하는 편이다. 그들이 나를 좋아하지 않고, 마음만 먹으면 언제든 나를 떠날 것 같다.", "기분이 가라앉거나, 일이 잘 안 풀리거나, 화가 날 때면 나는 지나치게 예민하게 반응할 때가 있다."], "7": ["삶은 정말 멋지다. 곰곰이 생각할수록 감사할 일이 참 많다.", "가장 행복할 때의 나는 유쾌하고, 자연스럽고, 에너지가 넘친다. 사실 나는 내가 아는 사람 중 가장 행복한 사람에 속한다.", "주변의 모든 것이 기쁨이 되기 때문에, 나는 모든 일에 열정적이고 무엇에서든 짜릿한 재미를 느낀다.", "나는 남다른 재능이 많고 큰 성취를 이룬 사람이다. 실제로 여러 가지 다양한 일을 잘한다.", "나는 매우 현실적이고 생산적인 사람이기도 하다. 현실 감각이 있고, 일을 어떻게 처리해야 하는지 안다.", "나는 맛집에 가서 맛있는 음식 먹기, 재미있는 일 즐기기, 여행 가기, 친구들과 놀기를 좋아한다.", "나는 여러 가지 일을 많이 해 보면서 즐겁게 산다. 인생은 한 번뿐이지만, 제대로 산다면 한 번으로도 충분하다.", "나는 욕심도 많고 갖고 싶은 것도 많다. 무언가를 원할 때 왜 굳이 참아야 하는지 모르겠다.", "나는 지루한 것이 딱 질색이고, 될 수 있으면 계속 움직이는 것을 좋아한다. 내 일정표는 할 일로 꽉 차 있고, 그게 바로 내가 원하는 것이다.", "가끔 지나치거나 선을 넘더라도, 나는 농담이나 가벼운 수다를 즐기고 무엇이든 거리낌 없이 털어놓는 것을 좋아한다.", "나는 누구보다 거침없고 솔직한 사람이다. 다른 사람들이 말하기 꺼리는 것도 나는 말한다.", "사람들이 나를 \"물질주의자\"라고 해도 신경 쓰지 않는다. 나는 아름답고 값비싼 것이 좋고, 갖고 싶다.", "나는 한쪽 극단으로 치우치는 편이다. 아주 넘치거나 아주 모자라거나, 어느 한쪽으로 갈 데까지 간다.", "나는 \"좋은 것은 아무리 많아도 지나치지 않다\"는 말에 공감한다.", "불편하거나 좌절을 겪으면 견딜 수 없이 화가 난다. 원하는 결과가 나올 때까지 소리를 지르고 싶어지고, 실제로 그럴 때가 많다.", "나는 어떤 것에 맛을 들이면 더 갖고 싶어 안달이 나고, 새롭고 색다른 것에 쉽게 빠져드는 편이다.", "기분이 가라앉거나 우울해지느니 차라리 현실을 피하는 편이 낫다. 뒤돌아보기보다는 앞으로 나아가고 싶다.", "사람들은 내가 원하는 것을 얻으려고 애쓰는 사람이라고 말할지도 모른다. 실제로 나는 원하는 것을 아주 열심히 좇는다.", "나는 나 자신을 통제하지 못했던 때도 있고, 간신히 통제했던 때도 있다.", "나는 가끔 신경이 곤두서고 초조해진다. 하지만 새로운 일에 빠지면 그런 기분은 금방 사라진다."], "8": ["나는 자기주장이 강하고 자신감이 넘친다.", "나는 기회를 알아보는 눈이 있고, 원하는 것을 이루는 방법을 안다. 일을 해내기 위해 사람들을 모을 수 있다.", "나는 배짱이 두둑하다. 용기 있게 힘든 일에 자주 도전하고, 끝내 해낸다.", "사람들은 나를 리더로 본다. 내가 강하고, 신념이 확고하며, 단호하게 결정하기 때문이다.", "나는 위험과 모험이 주는 짜릿함을 즐긴다. 일부러 위태로운 상황에 뛰어들기도 하고, 여러 어려움 속에서도 멋지게 성공한다.", "사람들은 나를 존경하고 우러러보며, 내 말을 따른다.", "나는 설득력이 있고 타고난 영업가다. 언제나 돈 벌 기회를 잡는다.", "나는 사업 수완이 좋은 사람이다. 내 사업을 늘 전보다 더 번창하게 만든다.", "돈은 곧 힘이기 때문에 중요하다. 돈이 충분하면 누구도 나를 힘으로 누를 수 없다.", "나는 만만치 않은 협상가다. 밀어붙일 때와 거절할 때를 알고, 절대 포기하지 않는다.", "나는 원하는 것을 얻는 방법을 알기 때문에, 사람들은 내 말을 감히 무시하지 못한다.", "상황이 어려워지면 결국 '그들이냐 나냐'의 생존 문제다. 마지막에 정상에 서는 사람은 내가 될 것이다.", "나는 헌신적인 사랑이나 순수한 이타심을 믿지 않는다. 그런 것은 스스로 아무것도 못 하는 약한 사람들의 감상적인 외침일 뿐이다.", "필요하다면 양쪽을 서로 맞붙여 이익을 챙기는 것도 마다하지 않는다. 어려운 상황에서 사람들이 진짜 믿고 기대는 것은 힘뿐이다.", "사람들이 나를 두려워하게 만드는 편이 낫다. 사람들이 나를 좋아한다고 해서 내가 원하는 것을 늘 얻을 수 있는 건 아니기 때문이다.", "나는 거친 사람으로 알려져 있다. 그래서 사람들은 될 수 있으면 나와 부딪히지 않으려 한다.", "한때 내 철학은 '힘이 곧 정의다'였다. 그 신념을 밀어붙일 때는 꽤 냉혹해지기도 했다.", "나는 원하는 것을 얻는 방식이 확고하다. 모든 것은 내가 쥐고 있으니, 나와 협력하지 않으면 누구도 아무것도 얻을 수 없다.", "나는 나 자신을 믿는다. 나는 위대한 사람이며, 왕이나 대단한 인물이 되었어야 했다.", "내가 원하는 것을 갖지 못한다면, 다른 누구도 그것을 갖지 못하게 만들 것이다."], "9": ["가장 좋을 때의 나는 내 의견을 분명히 말한다. 그러면서도 사람들과 가깝게 지내며, 특히 배우자·아이들과 더 친밀하게 지낸다.", "나는 주변 사람들이 잘 지내고, 모두가 행복하게 서로 아끼는 따뜻하고 편안한 분위기를 만드는 것을 좋아한다.", "사람들은 내가 한쪽 편을 들지도, 공격적이지도 않으며, 그저 편안하고 다가가기 쉬운 사람이라고 말한다.", "사람들은 기본적으로 선하다. 나는 사람들을 믿으며, 그들에게 숨은 속셈이 있지 않을까 의심하지 않는다.", "나는 내가 아주 복잡한 사람이라고 생각하지 않는다. 나는 낙천적이고, 나 자신과 지금의 삶에 만족한다.", "나에게는 명상적이고 신비로운 면이 있다. 자연과 함께하는 것을 좋아하고, 우주와 내가 하나라고 느낀다.", "나는 가족, 친구들과 더 다정하게 지내고 싶다. 그래서 그들이 원하는 것이라면 할 수 있는 만큼 다 해 주려고 한다. 그러면 나도 행복하다.", "나는 겉보기에 보수적이고 옛날 사람 같은 면이 있다. 특히 가족이나 가치관과 관련된 일에서는 정말 그렇다.", "대부분의 사람들은 너무 심각하고 걱정이 많다. 나는 대부분의 일에 왜 걱정해야 하는지 잘 모르겠다.", "나는 모든 일이 즐겁고 순조로웠으면 좋겠다. 사람들끼리 다투거나 크고 작은 문제로 시끄러워지는 것은 별로 좋아하지 않는다.", "대부분의 문제는 그렇게 큰일이 아니다. 보통은 결국 가장 좋은 쪽으로 해결된다.", "어떤 사람들은 내가 건망증이 있다고 생각할지도 모른다. 하지만 신경 쓰지 않는 게 나은 일들이 있어서, 그런 것을 생각하지 않을 뿐이다.", "사람은 절대 변하지 않는다. 그러니 있는 그대로 받아들일 수밖에 없다.", "나는 인생이 내 뜻과는 상관없이 그저 일어나는 일이라고 생각한다.", "나는 나 자신에 대해 깊이 생각하지 않는다. 그래 봤자 얻는 것도 없는데 왜 신경을 쓰겠는가?", "문제를 오래 내버려 두면 오히려 저절로 사라진다는 것을 알게 되었다.", "지난 일은 지나가게 마련이다. 될 수 있으면 문제를 뒤로 미루는 게 좋다.", "사람들이 가끔 나에게 화를 내는데, 그 이유를 모르겠다. 나는 좋은 사람이고, 누구에게도 해가 될 행동을 하지 않는다.", "가끔 내가 화를 내거나 감정이 격해지는 것은 우울한 기분 때문인 것 같다. 그래도 일단 말하고 나면 그걸로 끝난다.", "끔찍한 일이 나에게 일어나면 꿈처럼 현실이 아닌 것 같이 느껴진다. 그런 일이 정말 나에게 일어날 리 없다고 생각한다."], "1": ["나는 판단력이 좋고 매우 신중한 사람이다. 사실 좋은 판단력은 내 장점 중 하나다.", "나는 옳고 그름을 분명히 구별하며, 양심이 뚜렷하다.", "나는 다른 사람과 의견이나 생각이 다르더라도, 그들의 신념과 행동을 너그럽게 받아들일 수 있다.", "나에게 이득이 되든 안 되든, 당장 재미있든 없든 상관없이, 나는 양심에 따라 최선이라고 생각하는 일을 한다.", "개인적인 감정에 흔들리지 않도록, 나는 늘 가능한 한 공정하려고 한다.", "나에게는 흠 없이 바르게 사는 것이 중요하다. 다른 사람에게 큰 잘못을 했다면 잠을 이루지 못할 정도다.", "나는 무언가 잘못된 것을 보면, 할 수 있는 방법을 모두 찾아 바로잡아야 한다고 생각한다. 그것이 세상을 더 낫게 만드는 길이다.", "아쉽게도 늘 내 이상을 지키려고 애쓰다 보면 쉽게 지치는 것이 사실이다.", "나는 때때로 사람들에게 감정이 없거나 아주 딱딱한 사람처럼 보일 수 있다. 하지만 그들은 진짜 내 모습을 모른다.", "일이 잘못되거나 통제가 안 될 때는 체계적으로 정리하는 것이 필요하다.", "내가 하지 않으면 아무도 하지 않을 거라고 느낄 때가 많다. 그리고 대개는 내 생각이 맞다.", "나만큼 일을 완벽하게 해내는 사람은 많지 않다. 대부분의 사람들은 너무 게으르고, 책임을 너무 쉽게 피하는 것 같다.", "나는 내가 일중독이라고 생각하지 않지만, 쉬는 시간을 내기가 쉽지 않은 것은 사실이다.", "나는 거의 모든 일에 내 의견이 있고, 그 의견이 옳다고 생각한다. 옳다고 생각하지 않았다면 그 의견을 고집하지도 않았을 것이다.", "내가 자주 하라고 말했던 것을 사람들이 그대로 한다면, 그들은 더 잘 살게 될 것이다.", "옳은 것은 옳고, 그른 것은 그르다. 나는 왜 예외를 두어야 하는지 모르겠다.", "나는 말도 안 되는 일을 참을 필요는 없다고 생각한다. 사람들이 잘못하면 그것을 바로잡아 주는 것이 내 의무라고 생각한다.", "나는 살면서 대부분의 일을 올바르게 해 왔다. 내가 잘못한 일은 거의 없다고 확신한다.", "사실 나는 강박적이고, 어떤 일에는 좀 까다로울 수 있다. 하지만 그런 일들은 반드시 바르게 처리되어야 한다.", "잘못한 사람들은 그에 맞는 대가를 치르게 될 것이다. 내가 직접 그렇게 만들어야 한다 해도 말이다."]};
const NAMES = {1:"개혁가",2:"조력가",3:"성취자",4:"개인주의자",5:"탐구자",6:"충성가",7:"열정가",8:"도전자",9:"평화주의자"};
const ORDER = [1,2,3,4,5,6,7,8,9];
const KEY = "enneagram-v03";
let S = {page:0, ans:{}, chosen:null, name:''};
ORDER.forEach(t=>S.ans[t]=Array(20).fill(null));
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.ans){ S=Object.assign(S,s);} }catch(e){}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

const app=document.getElementById('app');
const answered=t=>S.ans[t].filter(v=>v!==null).length;
const yes=t=>S.ans[t].filter(v=>v===true).length;
const allDone=()=>ORDER.every(t=>answered(t)===20);
const totalAnswered=()=>ORDER.reduce((a,t)=>a+answered(t),0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderSteps(){
  const el=document.getElementById('steps'); let h='';
  h+=`<button class="step ${S.page===0?'cur':''} done" data-go="0"><i></i>안내</button>`;
  ORDER.forEach((t,i)=>{
    const a=answered(t), cls=a===20?'done':(a>0?'part':'');
    h+=`<button class="step ${cls} ${S.page===i+1?'cur':''}" style="--p:${a/20*100}%" data-go="${i+1}" aria-label="${t}유형, ${a}/20 답함"><i></i>${t}</button>`;
  });
  h+=`<button class="step ${allDone()?'done':''} ${S.page===10?'cur':''}" data-go="10" ${allDone()?'':'disabled'} aria-label="결과"><i></i>결과</button>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  document.getElementById('prog').textContent=`${totalAnswered()} / 180 문항`;
}
function go(p){ S.page=p; save(); render(); window.scrollTo({top:0}); }

function wheelSVG(scores, main, wing, mini){
  const c=160,r=118, pos=k=>{const a=(-90+40*(k%9))*Math.PI/180;return [c+r*Math.cos(a),c+r*Math.sin(a)];};
  const line=seq=>seq.map((k,i)=>{const p=pos(k);return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  let s=`<svg class="${mini?'mark':'wheel'}" viewBox="0 0 320 320" role="img" aria-label="에니어그램 도형">`;
  s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-width="2"/>`;
  s+=`<path d="${line([3,6,9,3])}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
  s+=`<path d="${line([1,4,2,8,5,7,1])}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
  for(let k=1;k<=9;k++){
    const [x,y]=pos(k);
    if(mini){ s+=`<circle cx="${x}" cy="${y}" r="13" fill="${k===9?'var(--teal)':'var(--surface)'}" stroke="var(--teal)" stroke-width="3"/>`; continue; }
    const isM=k===main, isW=k===wing;
    const fill=isM?'var(--teal)':isW?'var(--gold)':'var(--surface)';
    const stroke=isM?'var(--teal)':isW?'var(--gold)':'var(--line)';
    const tc=(isM||isW)?'var(--surface)':'var(--ink)';
    const lx=c+(r+32)*Math.cos((-90+40*(k%9))*Math.PI/180), ly=c+(r+32)*Math.sin((-90+40*(k%9))*Math.PI/180);
    s+=`<g class="pt"><circle cx="${x}" cy="${y}" r="${isM?24:19}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    s+=`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="${isM?17:14}" font-weight="600" fill="${tc}">${scores[k]}</text></g>`;
    s+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" font-size="13" fill="var(--muted)">${k}</text>`;
  }
  s+=`</svg>`;
  const cs=getComputedStyle(document.documentElement);
  return s.replace(/var\((--[\w-]+)\)/g,(m,n)=>cs.getPropertyValue(n).trim()||m);
}

function renderIntro(){
  app.innerHTML=`<section class="intro">
  ${wheelSVG({},0,0,true)}
  <h1>나는 어떤 유형일까요?</h1>
  <p class="lead">180개 문항에 '예' 또는 '아니오'로 답하면, 아홉 가지 성격 유형 중 나와 가장 가까운 유형과 날개 유형을 알려 드려요.</p>
  <div class="qa"><h2>에니어그램이 무엇인가요?</h2>
    <p>에니어그램은 MBTI처럼 성격 유형을 알아보는 검사입니다. MBTI가 성격을 16가지로 나눈다면, 에니어그램은 9가지로 나눕니다. 각 유형은 서로 영향을 주고받습니다.</p>
    <p>자세한 내용은 강의에서 설명해 드릴게요.</p></div>
  <div class="qa"><h2>검사는 어떻게 하나요?</h2>
    <ul>
      <li>1유형부터 9유형까지, 유형마다 20개의 문항이 있습니다.</li>
      <li>너무 깊이 고민하지 말고, 읽자마자 떠오르는 느낌대로 답해 주세요.</li>
      <li>문항에 동의하면 '예', 동의하지 않으면 '아니오'를 고르세요.</li>
      <li>점수는 자동으로 계산되고, 답한 내용은 이 브라우저에 저장되어 중간에 닫아도 이어서 할 수 있어요.</li>
    </ul></div>
  <div class="qa"><h2>결과는 어떻게 나오나요?</h2>
    <p>'예'가 가장 많은 유형이 나의 유형입니다. 가장 높은 유형이 2개 이상이면, 그 유형들의 문항을 다시 읽어 보고 나와 가장 잘 맞는 유형 하나를 고르게 됩니다.</p>
    <p>그다음 내 유형의 양옆에 있는 두 유형 중 '예'가 더 많은 쪽이 날개 유형이 됩니다.</p></div>
  <div class="nav"><span></span><button class="btn primary" id="start">${totalAnswered()?'이어서 하기':'검사 시작하기'}</button></div>
  </section>`;
  document.getElementById('start').onclick=()=>{
    if(!totalAnswered()) return go(1);
    const i=ORDER.findIndex(t=>answered(t)<20); go(i<0?10:i+1);
  };
}

function renderType(idx){
  const t=ORDER[idx-1], qs=DATA[t];
  let h=`<section><div class="typehead"><h1>${t}유형</h1><span class="count" id="cnt">${answered(t)} / 20 답함</span></div>
  <p class="hint">문항을 읽고 떠오르는 대로 '예' 또는 '아니오'를 골라 주세요.</p><ol class="qlist">`;
  qs.forEach((q,i)=>{
    const v=S.ans[t][i], nm=`t${t}q${i}`;
    h+=`<li class="q" id="q${i}"><span class="n">${i+1}</span><p class="t">${esc(q)}</p>
      <fieldset><legend>${i+1}번 문항</legend>
      <label class="opt"><input type="radio" name="${nm}" value="y" ${v===true?'checked':''}><span>예</span></label>
      <label class="opt no"><input type="radio" name="${nm}" value="n" ${v===false?'checked':''}><span>아니오</span></label>
      </fieldset></li>`;
  });
  h+=`</ol><div class="msg" id="msg" role="alert"></div>
  <div class="nav"><button class="btn quiet" id="prev">이전</button>
  <button class="btn primary" id="next">${idx===9?'결과 보기':'다음 유형'}</button></div></section>`;
  app.innerHTML=h;
  app.querySelectorAll('input[type=radio]').forEach(inp=>inp.onchange=()=>{
    const [,tt,qi]=inp.name.match(/t(\d)q(\d+)/);
    S.ans[tt][qi]=inp.value==='y'; save();
    document.getElementById('q'+qi).classList.remove('missing');
    document.getElementById('cnt').textContent=`${answered(t)} / 20 답함`;
    renderSteps();
  });
  document.getElementById('prev').onclick=()=>go(idx-1);
  document.getElementById('next').onclick=()=>{
    const miss=S.ans[t].map((v,i)=>v===null?i:-1).filter(i=>i>=0);
    if(miss.length){
      miss.forEach(i=>document.getElementById('q'+i).classList.add('missing'));
      const m=document.getElementById('msg'); m.textContent=`아직 답하지 않은 문항이 ${miss.length}개 있어요. 표시된 문항에 답해 주세요.`; m.classList.add('show');
      document.getElementById('q'+miss[0]).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    if(idx===9){
      const i=ORDER.findIndex(x=>answered(x)<20);
      if(i>=0){ const m=document.getElementById('msg'); m.textContent=`${ORDER[i]}유형에 답하지 않은 문항이 있어요. 먼저 모두 답해 주세요.`; m.classList.add('show'); return; }
      return go(10);
    }
    go(idx+1);
  };
}

function renderResult(){
  if(!allDone()){ go(0); return; }
  const sc={}; ORDER.forEach(t=>sc[t]=yes(t));
  const max=Math.max(...ORDER.map(t=>sc[t]));
  const top=ORDER.filter(t=>sc[t]===max);
  let main=top.length===1?top[0]:(top.includes(S.chosen)?S.chosen:null);
  let wing=null, wingNote='';
  if(main){
    const L=main===1?9:main-1, R=main===9?1:main+1;
    if(sc[L]===sc[R]) wingNote=`양옆의 ${L}유형과 ${R}유형 점수가 ${sc[L]}점으로 같아서 날개 유형을 정하지 않았어요.`;
    else wing=sc[L]>sc[R]?L:R;
  }
  const today=new Date(); const ds=`${today.getFullYear()}. ${today.getMonth()+1}. ${today.getDate()}.`;
  let h=`<section class="result reveal" id="resultSec"><h1>에니어그램 검사 결과</h1>
  <div class="meta"><label>이름 <input id="nameIn" type="text" placeholder="이름을 적어 주세요(선택)" value="${esc(S.name||'')}" maxlength="20"></label><span>검사일 ${ds}</span></div>
  <p class="label">유형별 '예' 개수로 계산했어요.</p>`;
  if(top.length>1){
    h+=`<div class="tie"><h2>가장 높은 유형이 ${top.length}개예요 (${top.map(t=>t+'유형').join(', ')}, 각 ${max}점)</h2>
      <p style="margin:0">아래 문항을 다시 읽어 보고, 나와 가장 잘 맞는 유형 하나를 골라 주세요.</p>`;
    top.forEach(t=>{
      h+=`<details data-html2canvas-ignore="true"><summary>${t}유형 ${NAMES[t]} 문항 보기</summary><ol>`+
        DATA[t].map((q,i)=>`<li class="${S.ans[t][i]?'y':'nn'}">${S.ans[t][i]?'✓ ':''}${esc(q)}</li>`).join('')+`</ol></details>`;
    });
    h+=`<div class="pick" data-html2canvas-ignore="true">`+top.map(t=>`<button class="btn ${main===t?'primary':''}" data-pick="${t}">${t}유형으로 정하기</button>`).join('')+`</div></div>`;
  }
  h+=`<div class="verdict">${wheelSVG(sc,main,wing,false)}<div>`;
  if(main){
    h+=`<p class="label">나의 유형</p><div class="big">${main}<small>유형</small></div><p style="margin:0;font-size:18px">${NAMES[main]} · ${sc[main]} / 20</p>
      <div class="wing"><p class="label">날개 유형</p>`+
      (wing?`<strong>${wing}유형 ${NAMES[wing]}</strong><p class="note">${main}유형 양옆(${main===1?9:main-1}·${main===9?1:main+1}유형) 중 '예'가 더 많은 유형이에요. 흔히 ${main}w${wing}로 표기합니다.</p>`
           :`<strong>정하지 않음</strong><p class="note">${wingNote}</p>`)+`</div>`;
  } else {
    h+=`<p class="label">나의 유형</p><div class="big" style="font-size:40px">선택 필요</div><p class="note">위에서 가장 잘 맞는 유형 하나를 고르면 결과가 나와요.</p>`;
  }
  h+=`</div></div>
  <div class="legend"><span style="--c:var(--teal)">나의 유형</span><span style="--c:var(--gold)">날개 유형</span><span>원 안의 숫자는 '예' 개수</span></div>
  <div class="scores"><h2>유형별 점수</h2>`+
  ORDER.map(t=>`<div class="row ${t===main?'main':''} ${t===wing?'wingrow':''}"><span>${t}유형 ${NAMES[t]}</span><div class="bar"><b style="width:${sc[t]/20*100}%"></b></div><span class="v">${sc[t]} / 20</span></div>`).join('')+
  `</div><p class="note" style="margin-top:16px">자세한 유형 설명은 강의에서 함께 살펴봐요.</p>
  <div class="actions" data-html2canvas-ignore="true"><button class="btn primary" id="pdf" ${main?'':'disabled'}>결과 PDF로 저장하기</button><button class="btn quiet" id="print">인쇄하기</button><button class="btn quiet" id="edit">답 수정하기</button><button class="btn" id="reset">처음부터 다시 하기</button></div><p class="note" id="pdfMsg" data-html2canvas-ignore="true" role="status"></p></section>`;
  app.innerHTML=h;
  document.getElementById('nameIn').oninput=e=>{S.name=e.target.value;save();};
  document.getElementById('pdf').onclick=()=>savePDF(main);
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.chosen=+b.dataset.pick;save();renderResult();});
  document.getElementById('edit').onclick=()=>go(1);
  document.getElementById('print').onclick=()=>window.print();
  document.getElementById('reset').onclick=()=>{
    if(!confirm('모든 답을 지우고 처음부터 다시 할까요?'))return;
    ORDER.forEach(t=>S.ans[t]=Array(20).fill(null)); S.chosen=null; go(0);
  };
}

async function savePDF(main){
  const btn=document.getElementById('pdf'), msg=document.getElementById('pdfMsg');
  if(!window.html2canvas||!window.jspdf){ msg.textContent='PDF 기능을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.'; return; }
  btn.disabled=true; btn.textContent='PDF 만드는 중…'; msg.textContent='';
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const sec=document.getElementById('resultSec');
    const canvas=await html2canvas(sec,{scale:2,backgroundColor:'#FFFFFF',windowWidth:760,useCORS:true,
      onclone:doc=>{
        const sc=doc.getElementById('resultSec'); sc.style.animation='none'; sc.style.padding='28px 24px'; sc.style.width='720px';
        const inp=doc.getElementById('nameIn'); const sp=doc.createElement('strong');
        sp.textContent=(S.name||'').trim()||'          '; inp.replaceWith(sp);
      }});
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    const pw=210, ph=297, m=10; let w=pw-m*2, h=canvas.height*w/canvas.width;
    if(h>ph-m*2){ h=ph-m*2; w=canvas.width*h/canvas.height; }
    pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',(pw-w)/2,m,w,h);
    const nm=(S.name||'').trim().replace(/[\\/:*?"<>|\s]+/g,'_');
    pdf.save(`에니어그램_결과_${main}유형${nm?'_'+nm:''}.pdf`);
    msg.textContent='PDF를 저장했어요. 휴대폰에서는 다운로드 폴더나 파일 앱에서 확인할 수 있어요.';
  }catch(e){ console.error(e); msg.textContent='PDF를 만들지 못했어요. 인쇄하기를 누른 뒤 대상(프린터)을 "PDF로 저장"으로 골라 저장해 주세요.'; }
  btn.disabled=false; btn.textContent='결과 PDF로 저장하기';
}

function render(){
  renderSteps();
  if(S.page===0) renderIntro();
  else if(S.page===10) renderResult();
  else renderType(S.page);
}
render();
</script>
</body>
